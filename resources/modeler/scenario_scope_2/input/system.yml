system:
  id: sys_example_15_1
  description: >
    One timestep, two Monte-Carlo scenarios (scenario-scope include [0, 1]).
    One component containing 2 generators
      The generators have no Pmin constraint.
      Generator 1 costs 0.5 €/MW and has a Pmax of 80 MW.
      Generator 2 costs 6 €/MW and has a maximum output of 200 MW.
    one component with a scenario-dependent load (load_value timeseries):
      scenario 0 is linked to the 1st timeseries (load = 50 MW)
      scenario 1 is linked to the 2nd timeseries (load = 100 MW)
    One component representing the energy balance constraint=
    Solution :
      scenario 0: node1.gen1_p[0] = 50, node1.gen2_p[0] = 0, objective value: 25
      scenario 1: node1.gen1_p[0] = 80, node1.gen2_p[0] = 20, objective value: 160


  components:
    - id: N
      model: lib_example_15_1.balance_node

    - id: NG
      model: lib_example_15_1.node_2gen

      parameters:
        - id: gen1_max_p
          time-dependent: false
          scenario-dependent: false
          value: 80
        - id: gen1_prop_cost
          time-dependent: false
          scenario-dependent: false
          value: 0.5
        - id: gen2_max_p
          time-dependent: false
          scenario-dependent: false
          value: 200
        - id: gen2_prop_cost
          time-dependent: false
          scenario-dependent: false
          value: 6

    - id: NL
      model: lib_example_15_1.node_load
      scenario-group: load_group
      parameters:
        - id: load
          time-dependent: true
          scenario-dependent: true
          value: load_value

  connections:
    - component1: N
      port1: injection_port
      component2: NL
      port2: injection_port

    - component1: N
      port1: injection_port
      component2: NG
      port2: injection_port
