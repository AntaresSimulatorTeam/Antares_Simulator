system:
  id: sys_example_14_5
  description: >
    Single component with one variable x and time series p = {1, 2, 3, 4, 5}.
    The constraint x >= sum(3 .. 4, p) uses fixed bounds ending at the last valid index
    (4 for a 5-timestep window). Accessed indices are always {3, 4}: p[3]+p[4] = 4+5 = 9.
    Expected: x = 9 at all 5 timesteps, objective = 45.


  components:
    - id: c1
      model: lib_example_14_5.fixed_bounds_last_index_demo

      parameters:
        - id: p
          time-dependent: true
          scenario-dependent: false
          value: p_14_5
