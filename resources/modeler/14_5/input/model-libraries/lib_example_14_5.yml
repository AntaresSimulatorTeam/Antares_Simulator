library:
  id: lib_example_14_5
  description: Fixed sum bounds reaching the last index of the window

  models:
    - id: fixed_bounds_last_index_demo
      description: >
        Variable bounded below by sum(3 .. 4, p) with 5 timesteps (size=5).
        The upper bound 4 is the last valid index of the block (absolute bounds
        outside [0, 4] are rejected).
        Accessed indices: 3, 4 -> p[3]+p[4] = 4+5 = 9.
        This result is constant across all timesteps (fixed bounds).
      parameters:
        - id: p
          time-dependent: true
          scenario-dependent: false
      variables:
        - id: x
          lower-bound: 0
          upper-bound: 1000
          variable-type: continuous
          # x[t] >= sum(3..4, p) = p[3]+p[4] = 4+5 = 9 for all t
      constraints:
        - id: lower_bound_from_wrapping_sum
          expression: x >= sum(3 .. 4, p)
      objective-contributions:
        - id: objective
          expression: sum(x)
