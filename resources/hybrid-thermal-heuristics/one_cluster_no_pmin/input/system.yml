system:
  id: one_cluster

  components:
    - id: D
      model: antares_legacy_models.load
      parameters:
        - id: load
          time-dependent: true
          scenario-dependent: false
          value: demand-ts-only-hour13
    - id: G
      model: antares_legacy_models.thermal
      integer-strategy:
        id: heuristic
        heuristic-id: accurate
      parameters:
        - id: max_power_per_unit
          time-dependent: false
          scenario-dependent: false
          value: 1000
        - id: min_power_per_unit
          time-dependent: false
          scenario-dependent: false
          value: 0
        - id: cluster_max_generation
          time-dependent: false
          scenario-dependent: false
          value: 3000
        - id: cluster_min_gen_modulation
          time-dependent: false
          scenario-dependent: false
          value: 0
        - id: market_bid_cost
          time-dependent: false
          scenario-dependent: false
          value: 50
        - id: startup_cost
          time-dependent: false
          scenario-dependent: false
          value: 50
        - id: fixed_cost
          time-dependent: false
          scenario-dependent: false
          value: 1
        - id: min_up_duration
          time-dependent: false
          scenario-dependent: false
          value: 3
        - id: min_down_duration
          time-dependent: false
          scenario-dependent: false
          value: 10
        - id: num_units
          time-dependent: false
          scenario-dependent: false
          value: 3
        - id: spinning
          time-dependent: false
          scenario-dependent: false
          value: 0


  area-connections:
    - component: D
      port: balance_port
      area: node
    
    - component: G
      port: balance_port
      area: node





