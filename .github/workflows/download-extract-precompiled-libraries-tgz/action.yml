name: "Download extract .tgz precompiled libraries"
description: "Download and extract .tgz precompiled libraries from antares-deps and antares-simulator repository"
inputs:
  os:
    description: 'operational system used for github action'
    required: true
  buildtype:
    description: 'build type'
    required: false
    default: 'Release'
  ortools-url:
    description: 'URL for OR-Tools'
    required: true
  ortools-dir:
    description: 'Destination directory for OR-Tools'
    required: true

runs:
  using: "composite"
  steps:

  - name: Download & extract OR-Tools
    shell: bash
    run: |
           mkdir -p  ${{inputs.ortools-dir}}
           cd ${{inputs.ortools-dir}}
           curl -Ls -o ortools.zip ${{inputs.ortools-url}}
           unzip ortools.zip
           rm ortools.zip
           # ensure the install root exists at inputs.ortools-dir/install to match the
           # ORTOOLS_INSTALL_DIR expected by CMake. Some archives extract into an
           # "install" subdir already; if not, and we have lib/ and include/ at
           # the root, move them under install/ for consistency.
           if [ -d "lib" -a -d "include" -a ! -d "install" ]; then
             mkdir -p install
             mv lib include install/
           fi
