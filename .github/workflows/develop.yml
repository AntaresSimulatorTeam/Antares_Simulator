name: continuous-delivery

on:
  push:
    branches:
      - develop
  schedule:
    - cron: '21 2 * * *'
jobs:
  release:
    name: Release pushed tag
    runs-on: ubuntu-22.04
    steps:
      - name: deleting continuous-delivery if it exists
        run: |
          if gh release view continuous-delivery > /dev/null 2>&1; then
            gh release delete continuous-delivery -y
          else
            echo "Release continuous-delivery does not exist."
          fi
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: continuous-delivery
          title: continuous-delivery
          tests: true
          target_branch: develop
          latest: true
        run: |
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="$title" \
              --notes="This release contains the latest development version (latest successful builds of "develop" branch)"\
              --target="$target_branch" \
              --latest=$latest
  

  ubuntu:
    name: Release - Ubuntu
    needs: release
    uses: ./.github/workflows/ubuntu.yml
    with:
      run-tests: ${{ inputs.run-tests }}
      target_branch: ${{ inputs.target_branch }}
      category: continuous-delivery

  windows:
    name: Release - Windows
    needs: release
    uses: ./.github/workflows/windows-vcpkg.yml
    with:
      run-tests: ${{ inputs.run-tests }}
      target_branch: ${{ inputs.target_branch }}
      category: continuous-delivery

  centos7:
    name: Release - centos7
    needs: release
    uses: ./.github/workflows/centos7.yml
    with:
      run-tests: ${{ inputs.run-tests }}
      target_branch: ${{ inputs.target_branch }}
      category: continuous-delivery

  oracle8:
    name: Release - oracle8
    needs: release
    uses: ./.github/workflows/oracle8.yml
    with:
      run-tests: ${{ inputs.run-tests }}
      target_branch: ${{ inputs.target_branch }}
      category: continuous-delivery

  user_guide:
    name: User Guide
    needs: release
    uses: ./.github/workflows/build-userguide.yml
    with:
      run-tests: ${{ inputs.run-tests }}
      target_branch: ${{ inputs.target_branch }}
      category: continuous-delivery
