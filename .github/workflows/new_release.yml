name: Create new release

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Target branch or full commit SHA"
        required: true
      release_tag:
        description: "Release tag"
        required: true
      release_name:
        description: "Release name"
        required: true
      run-tests:
        description: "Run all tests?"
        required: true
        type: boolean
      set_latest:
        description: "Set the release as latest"
        required: true
        type: boolean
      generate_results:
        description: "Generate results?"
        required: true
        type: boolean
        default: false
      seed_asset_mirror:
        description: "Mirror this release's vcpkg source archives?"
        required: true
        type: boolean
        default: true
jobs:
  release:
    name: Release pushed tag
    runs-on: ubuntu-22.04
    outputs:
      release_url: ${{ steps.create_release.outputs.release_url }}
      tag: ${{ steps.create_release.outputs.tag }}
    steps:
    - name: Create release
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        tag: ${{ github.event.inputs.release_tag }}
        title: ${{ github.event.inputs.release_name }}
        tests: ${{ github.event.inputs.run-tests }}
        target_branch: ${{ github.event.inputs.target_branch }}
        latest: ${{ github.event.inputs.set_latest }}
      run: |
        gh release create "$tag" \
            --repo="$GITHUB_REPOSITORY" \
            --title="$title" \
            --notes="Run tests: $tests"\
            --target="$target_branch" \
            --latest=$latest
        # Get release URL from gh CLI
        REL=$(gh release view "$tag" --repo="$GITHUB_REPOSITORY" --json url --jq '.url') || true
        echo "release_url=${REL}" >> $GITHUB_OUTPUT
        echo "tag=${tag}" >> $GITHUB_OUTPUT

  ubuntu:
    name: Release - Ubuntu
    needs: release
    uses: ./.github/workflows/ubuntu.yml
    with:
      run-tests: ${{ inputs.run-tests }}
      target_branch: ${{ inputs.target_branch }}

  windows:
    name: Release - Windows
    needs: release
    uses: ./.github/workflows/windows-vcpkg.yml
    with:
      run-tests: ${{ inputs.run-tests }}
      target_branch: ${{ inputs.target_branch }}

  oracle8:
    name: Release - oracle8
    needs: release
    uses: ./.github/workflows/oracle8.yml
    with:
      run-tests: ${{ inputs.run-tests }}
      target_branch: ${{ inputs.target_branch }}

  test_nr_commit_id:
    name: Get Antares_Simulator_Tests_NR commit id
    runs-on: ubuntu-22.04
    needs: release
    outputs:
      tests_commit_hash: ${{ steps.get_test_commit.outputs.commit_hash }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get Antares_Simulator_Tests_NR commit hash
        id: get_test_commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Ensure the submodule is checked out
          git submodule update --init resources/Antares_Simulator_Tests_NR
          # Get the commit hash for the specific submodule path
          COMMIT_HASH=$(git ls-tree HEAD resources/Antares_Simulator_Tests_NR | awk '{print $3}')

          tests_repo="AntaresSimulatorTeam/Antares_Simulator_Tests_NR"
          asset_url="https://github.com/${tests_repo}/releases/download/${COMMIT_HASH}/study-batches.txt"
          if curl -sfIL -o /dev/null "$asset_url"; then
            echo "Release asset found for ${COMMIT_HASH}; pinning antares_tests_tag to it."
            echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          else
            echo "No study-batches.txt release found for ${COMMIT_HASH} in ${tests_repo}; falling back to Tests_NR main branch."
            echo "commit_hash=" >> "$GITHUB_OUTPUT"
          fi

  generate_results:
    name: Generate Results
    needs:
      - ubuntu
      - windows
      - test_nr_commit_id
    # Only run this job if the `generate_results` input is true AND all the required build jobs succeeded.
    # If you'd like to generate results even when some builds fail, replace this condition with a less strict one
    # (for example, exclude some jobs) or add a new input like `allow_partial_results` to control that behavior.
    if: ${{ github.event.inputs.generate_results == 'true' && needs.ubuntu.result == 'success' && needs.windows.result == 'success' }}
    uses: AntaresSimulatorTeam/SimTest/.github/workflows/generate-reference.yml@main
    permissions:
      contents: write
      actions: read
    with:
      # Map inputs expected by the external reusable workflow
      release_tag: ${{ github.event.inputs.release_tag }}
      antares_tag: ${{ github.event.inputs.release_tag }}
      antares_tests_tag: ${{ needs.test_nr_commit_id.outputs.tests_commit_hash }}
      target_branch: ''
    # Note: the external reusable workflow currently does not declare secrets in its 'workflow_call',
    # so we cannot pass SIMTEST_PAT here. If the remote workflow needs a PAT, update its 'on: workflow_call: secrets:'
    # to declare the secret, then re-add mapping here.
    secrets:
      SIMTEST_PAT: ${{ secrets.SIMTEST_REPO_PAT }}

  seed_asset_mirror:
    name: Seed vcpkg asset mirror
    needs: release
    # A release freezes a point in develop's history that a maintenance branch
    # may later be cut from, so it is the moment worth capturing: the mirror
    # keeps that ref buildable years later, after upstream has purged the source
    # archives its baseline pins.
    if: ${{ github.event.inputs.seed_asset_mirror == 'true' }}
    permissions:
      # Not what performs the upload -- that uses VCPKG_ASSET_PAT, since this
      # repository's token has no access to the mirror. Declared because GitHub
      # validates a called workflow's requested permissions against the caller.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            triplet: x64-linux
          - runner: windows-2022
            triplet: x64-windows-release
    uses: AntaresSimulatorTeam/antares-vcpkg-registry/.github/workflows/seed.yml@main
    with:
      repository: ${{ github.repository }}
      # The tag rather than the branch: it pins exactly the commit released.
      ref: ${{ needs.release.outputs.tag }}
      runner: ${{ matrix.runner }}
      triplet: ${{ matrix.triplet }}
    secrets:
      MIRROR_TOKEN: ${{ secrets.VCPKG_ASSET_PAT }}
