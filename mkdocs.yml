docs_dir: docs
repo_name: Antares_Simulator
site_name: Antares Simulator Documentation
repo_url: https://github.com/AntaresSimulatorTeam/Antares_Simulator
edit_uri: edit/doc/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/Icone.png
  prev_next_buttons_location: none
  custom_dir: docs/overrides
  features:
    - navigation.instant
    - navigation.top
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to light mode

nav:
  - Home: index.md
  - Reference:
      - Installation: reference/installation.md
      - Solver:
          - Input files: reference/solver/inputs.md
          - Output files: reference/solver/outputs.md
          - Parameters: reference/solver/parameters.md
          - Hybrid studies: reference/solver/hybrid-studies.md
          - Appendix: reference/solver/appendix.md
          - Optimization engine support:
              - FICO® Xpress Optimizer: reference/solver/optional-features/xpress.md
      - Modeler:
          - Overview: reference/modeler/01-overview-modeler.md
          - Input files: reference/modeler/02-inputs.md
          - Output files: reference/modeler/03-outputs.md
          - Parameters: reference/modeler/04-parameters.md
          - Optimization model: reference/modeler/05-model.md
          - Heuristics: reference/modeler/06-heuristics.md
          - Standard library: reference/modeler/07-standard-library.md
          - Command-line interface: reference/modeler/08-command-line.md
          - Expressions: reference/modeler/09-expressions.md
      - Time-series generation:
          - Overview: reference/ts-generator/01-overview-tsgenerator.md
          - Input files: reference/ts-generator/02-inputs.md
          - Output files: reference/ts-generator/03-outputs.md
          - Parameters: reference/ts-generator/04-parameters.md
          - Algorithm: reference/ts-generator/05-algorithm.md
          - Command-line instructions: reference/ts-generator/06-command-line.md
      - Other features:
          - Batch Runner: reference/other-features/batchrun.md
          - Config Checker: reference/other-features/config.md
          - Kirchhoff's constraint generator: reference/other-features/kirchhoff-constraints-builder.md
          - Study Cleaner: reference/other-features/study-cleaner.md
          - Study Finder: reference/other-features/study-finder.md
          - Study Updater: reference/other-features/study-updater.md
          - Vacuum: reference/other-features/vacuum.md
          - Year-by-Year Aggregator: reference/other-features/ybyaggregator.md
      - Migration guides: reference/migration-guides.md
      - Attribution notices: reference/attribution-notices.md
  - Developer guide:
      - Overview: developer-guide/0-Overview.md
      - Development requirements: developer-guide/1-Development-requirements.md
      - Dependencies install: developer-guide/2-Dependencies-install.md
      - Build: developer-guide/3-Build.md
      - ANTLR4 code generation: developer-guide/7-antlr4.md
      - Tests (user): developer-guide/4-Tests-user.md
      - Tests (developer): developer-guide/4-Tests-dev.md
      - Installer creation: developer-guide/5-Installer-creation.md
      - Contributing: developer-guide/6-Contributing.md
      - Continuous Integration: developer-guide/continuous-integration.md
      - Docker, CMake presets and CLion: developer-guide/9-DockerAndCMakePresets.md
      - OR-tools integration: developer-guide/ortools-integration.md
      - Study format conventions: developer-guide/8-study-format-conventions.md
      - Changelog: developer-guide/CHANGELOG.md
      - Software architecture:
          - Dynamic modeler architecture: developer-guide/Architecture/Dynamic-modeler-architecture.md


plugins:
  - search
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/
      puml_keyword: plantuml

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://code.jquery.com/jquery-3.6.0.min.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js

markdown_extensions:
  - footnotes
  - attr_list
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

exclude_docs: |
  /architecture/
  /architecture-decision-record/
  README.md

validation:
  omitted_files: warn
  absolute_links: warn  
  unrecognized_links: warn
  anchors: warn

copyright: Copyright &copy; 2007 - 2025 RTE
