library:
  id: lib_example_14_4
  description: Inverted t+ bounds (from > to) with a constant parameter

  models:
    - id: inverted_bounds_demo
      description: >
        Variable constrained by x = sum(t+2 .. t+0, p) + c.
        The bounds t+2 and t+0 always satisfy from > to (by exactly 2), so the sum
        is always empty and must equal zero.

        Correct behaviour: sum = 0 at every timestep, x = 0 + c = c = 20.
        Objective = 5 * 20 = 100.

        Bug (constant-expression branch in ReadLinearExpressionVisitor):
          The constant branch computes term *= (to - from + 1).
          Here to - from + 1 = (t+0) - (t+2) + 1 = -1  (negative!).
          This gives sum = p * (-1) = 10 * (-1) = -10 instead of 0.
          Then x = -10 + 20 = 10, objective = 50.

        A test checking objective = 100 and x = 20 catches this bug.
      parameters:
        - id: p
          time-dependent: false
          scenario-dependent: false
        - id: c
          time-dependent: false
          scenario-dependent: false
      variables:
        - id: x
          lower-bound: 0
          upper-bound: 1000
          variable-type: continuous
      constraints:
        - id: equality_from_inverted_sum
          expression: x = sum(t+2 .. t+0, p) + c
      objective-contributions:
        - id: objective
          expression: sum(x)
